<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hang Out?</title>
  <!-- Load canvas-confetti library from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
      
      /* --- GHIBLI BACKGROUND IMPLEMENTATION --- */
      /* Make sure you upload 'totoro_scene.webp' (or similar) to the same directory on GitHub */
      background-image: url('totoro_scene.webp');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    h1 {
      font-size: 2.8rem;
      color: #ffffff; /* White text for contrast */
      text-shadow: 0 3px 6px rgba(0,0,0,0.5); /* Strong shadow for readability */
    }

    .btn-container {
      margin-top: 30px;
      position: relative;
      width: 300px;
      height: 100px;
    }
    button {
      padding: 14px 28px;
      font-size: 1.3rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      position: absolute;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }
    #yesBtn {
      background-color: #28a745;
      color: white;
      left: 30px;
    }
    #noBtn {
      background-color: #dc3545;
      color: white;
      right: 30px;
    }
  </style>
</head>
<body>

  <h1 id="question">Will you hang out with me?</h1>
  <div class="btn-container">
    <button id="yesBtn">Yes!</button>
    <button id="noBtn">No</button>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const question = document.getElementById('question');

    // Make the "No" button dodge the cursor/touch
    function moveButton() {
      // Calculate a random position, avoiding getting stuck in corners
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
      
      // Force position to 'fixed' to override initial position
      noBtn.style.position = 'fixed';
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    }

    // Modern browsers support hover (desktop) and touch (mobile)
    noBtn.addEventListener('mouseover', moveButton);
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault(); // Prevents accidental 'clicks' on mobile
      moveButton();
    });

    // "Yes" Button Action
    yesBtn.addEventListener('click', () => {
      question.innerText = "Awesome! See you soon 🎉";
      question.style.color = "#FFD700"; // Gold color for success
      noBtn.style.display = 'none'; // Hide the elusive button
      yesBtn.style.transform = 'scale(1.4)'; // Subtle zoom

      // Trigger Confetti Explosion (Centered on button)
      confetti({
        particleCount: 150,
        spread: 100,
        origin: { y: 0.6 }
      });
    });
  </script>

</body>
</html>
