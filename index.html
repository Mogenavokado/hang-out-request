<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hang Out?</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
      
      /* Static Ghibli Background */
      background-image: url('totoro.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Fullscreen Overlay Canvas for Sunlight & Particles */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .content-wrapper {
      position: relative;
      z-index: 1;
      text-align: center;
      background: rgba(255, 255, 255, 0.15);
      padding: 50px;
      border-radius: 25px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.15);
    }

    h1 {
      font-size: 2.8rem;
      color: #ffffff;
      margin: 0;
      text-shadow: 0 2px 4px rgba(0, 0, 0, 0.4);
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .btn-container {
      margin-top: 40px;
      position: relative;
      width: 320px;
      height: 100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    button {
      padding: 16px 32px;
      font-size: 1.2rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      position: absolute;
      transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      font-family: 'Nunito', sans-serif;
      letter-spacing: 0.3px;
    }

    button:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }

    button:active {
      transform: translateY(-1px);
    }

    #yesBtn {
      background: linear-gradient(135deg, #a8d5ba 0%, #7ec69f 100%);
      color: #ffffff;
      left: 10px;
    }

    #yesBtn:hover {
      background: linear-gradient(135deg, #95ccaa 0%, #6ebc8f 100%);
    }

    #noBtn {
      background: linear-gradient(135deg, #f5b7a1 0%, #e89d7d 100%);
      color: #ffffff;
      right: 10px;
    }

    #noBtn:hover {
      background: linear-gradient(135deg, #f0a890 0%, #de8c6d 100%);
    }
  </style>
</head>
<body>

  <canvas id="particleCanvas"></canvas>

  <div class="content-wrapper">
    <h1 id="question">Will you hang out with me?</h1>
    <div class="btn-container">
      <button id="yesBtn">Yes!</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <script>
    // --- Canvas Sunlight & Leaf Animation Setup ---
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const sunrays = [];
    const leaves = [];

    // Sunlight Ray Object
    class SunRay {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * -canvas.height;
        this.length = Math.random() * 150 + 100;
        this.speed = Math.random() * 3 + 1;
        this.opacity = Math.random() * 0.15 + 0.05;
        this.width = Math.random() * 3 + 1;
      }
      update() {
        this.y += this.speed;
        this.opacity -= 0.0008;
        if (this.y > canvas.height || this.opacity <= 0) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.strokeStyle = `rgba(255, 220, 100, ${this.opacity})`;
        ctx.lineWidth = this.width;
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x + Math.sin(this.y / 50) * 30, this.y + this.length);
        ctx.stroke();
      }
    }

    // Floating Forest Leaf Object
    class Leaf {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * -50;
        this.size = Math.random() * 6 + 4;
        this.speedY = Math.random() * 1.5 + 0.8;
        this.speedX = Math.sin(Math.random() * Math.PI) * 1.2;
        this.opacity = Math.random() * 0.6 + 0.3;
        this.color = Math.random() > 0.5 ? '#80a775' : '#d4a359';
      }
      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y / 30) * 0.8;
        if (this.y > canvas.height) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.opacity;
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }
    }

    // Initialize Particles
    for (let i = 0; i < 40; i++) sunrays.push(new SunRay());
    for (let i = 0; i < 25; i++) leaves.push(new Leaf());

    // Main Animation Loop
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      sunrays.forEach(ray => { ray.update(); ray.draw(); });
      leaves.forEach(leaf => { leaf.update(); leaf.draw(); });
      requestAnimationFrame(animate);
    }
    animate();

    // --- Button Actions ---
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const question = document.getElementById('question');

    function moveButton() {
      const maxX = Math.max(0, window.innerWidth - noBtn.offsetWidth);
      const maxY = Math.max(0, window.innerHeight - noBtn.offsetHeight);
      const x = Math.random() * maxX;
      const y = Math.random() * maxY;
      noBtn.style.position = 'fixed';
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    }

    noBtn.addEventListener('mouseover', moveButton);
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveButton();
    });

    yesBtn.addEventListener('click', () => {
      question.innerText = "Awesome! See you soon 🎉";
      noBtn.style.display = 'none';
      yesBtn.style.transform = 'scale(1.3)';

      confetti({
        particleCount: 150,
        spread: 90,
        origin: { y: 0.6 }
      });
    });
  </script>

</body>
</html>
