<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hang Out?</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: 'Nunito', sans-serif;
      overflow: hidden;
      position: relative;
      
      /* Static Ghibli Background */
      background-image: url('totoro.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -15%;
      background: radial-gradient(circle at 20% 20%, rgba(255, 226, 133, 0.28), transparent 22%),
                  radial-gradient(circle at 80% 15%, rgba(255, 255, 255, 0.16), transparent 18%),
                  radial-gradient(circle at 50% 80%, rgba(158, 206, 255, 0.18), transparent 24%);
      filter: blur(24px);
      animation: ambientDrift 18s ease-in-out infinite alternate;
      z-index: 0;
      pointer-events: none;
    }

    @keyframes ambientDrift {
      0% { transform: translate3d(-2%, 0, 0) scale(1); }
      100% { transform: translate3d(2%, -2%, 0) scale(1.08); }
    }

    /* Fullscreen Overlay Canvas for Sunlight & Particles */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 1;
      pointer-events: none;
    }

    .content-wrapper {
      position: relative;
      z-index: 2;
      text-align: center;
      background: rgba(255, 255, 255, 0.08);
      padding: 50px;
      border-radius: 25px;
      border: none;
      box-shadow: none;
    }

    .content-wrapper::before {
      content: "";
      position: absolute;
      inset: -10%;
      background: radial-gradient(circle, rgba(255,255,255,0.12), transparent 60%);
      z-index: -1;
      animation: glowPulse 5s ease-in-out infinite alternate;
    }

    @keyframes glowPulse {
      0% { transform: scale(0.96); opacity: 0.5; }
      100% { transform: scale(1.06); opacity: 1; }
    }

    h1 {
      font-size: 2.8rem;
      color: #ffffff;
      margin: 0;
      text-shadow: 0 2px 10px rgba(255, 255, 255, 0.35), 0 5px 25px rgba(75, 128, 191, 0.32);
      font-weight: 700;
      letter-spacing: 0.5px;
      animation: titleFloat 5s ease-in-out infinite;
    }

    @keyframes titleFloat {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-4px); }
    }

    .btn-container {
      margin-top: 40px;
      position: relative;
      width: 320px;
      height: 100px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    button {
      padding: 16px 0px;
      width: 150px; /* Lock explicit width */
      font-size: 1.2rem;
      font-weight: 700;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      position: absolute;
      transition: transform 0.35s cubic-bezier(0.22, 1, 0.36, 1),
                  top 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                  left 0.6s cubic-bezier(0.22, 1, 0.36, 1),
                  box-shadow 0.3s ease,
                  background 0.3s ease,
                  filter 0.3s ease;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      font-family: 'Nunito', sans-serif;
      letter-spacing: 0.3px;
      will-change: transform, left, top;
    }

    button:hover {
      transform: translateY(-8px) scale(1.04) rotate(-1deg);
      box-shadow: 0 12px 24px rgba(0, 0, 0, 0.22);
      filter: saturate(1.12);
    }

    button:active {
      transform: translateY(-2px) scale(0.99);
    }

    #yesBtn {
      background: linear-gradient(135deg, #b9dfc7 0%, #8fd0ad 100%);
      color: #ffffff;
      left: 10px;
      box-shadow: 0 10px 18px rgba(143, 208, 173, 0.25);
    }

    #yesBtn:hover {
      background: linear-gradient(135deg, #c8ead4 0%, #9fdcb9 100%);
      transform: translateY(-6px) scale(1.03);
      box-shadow: 0 14px 22px rgba(143, 208, 173, 0.35);
      animation: yesPulse 1.4s ease-in-out infinite alternate;
    }

    #noBtn {
      background: linear-gradient(135deg, #f5b7a1 0%, #e89d7d 100%);
      color: #ffffff;
      right: 10px;
    }

    #noBtn:hover {
      background: linear-gradient(135deg, #f0a890 0%, #de8c6d 100%);
      animation: noPulse 1.3s ease-in-out infinite alternate;
    }

    @keyframes yesPulse {
      0% { box-shadow: 0 8px 18px rgba(126, 198, 159, 0.35); }
      100% { box-shadow: 0 16px 28px rgba(126, 198, 159, 0.55); }
    }

    @keyframes noPulse {
      0% { box-shadow: 0 8px 18px rgba(232, 157, 125, 0.35); }
      100% { box-shadow: 0 16px 28px rgba(232, 157, 125, 0.55); }
    }
  </style>
</head>
<body>

  <canvas id="particleCanvas"></canvas>

  <div class="content-wrapper">
    <h1 id="question">Will you hang out next weekend?</h1>
    <div class="btn-container">
      <button id="yesBtn">Yes!</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <script>
    // --- Canvas Ambient Motion Setup ---
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const sunrays = [];
    const leaves = [];

    // Dreamy floating glows instead of harsh sun rays
    class SunRay {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.radius = Math.random() * 5 + 2;
        this.speedX = (Math.random() - 0.5) * 0.5;
        this.speedY = Math.random() * 0.6 + 0.2;
        this.opacity = Math.random() * 0.18 + 0.04;
        this.color = Math.random() > 0.5 ? 'rgba(255, 242, 180, ' : 'rgba(255, 255, 255, ';
      }
      update() {
        this.x += this.speedX;
        this.y -= this.speedY;

        if (this.y < -10) this.reset();
        if (this.x < -10) this.x = canvas.width + 10;
        if (this.x > canvas.width + 10) this.x = -10;
      }
      draw() {
        ctx.beginPath();
        ctx.fillStyle = `${this.color}${this.opacity})`;
        ctx.shadowColor = `${this.color}${this.opacity + 0.12})`;
        ctx.shadowBlur = 12;
        ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;
      }
    }

    // Floating Forest Leaf Object
    class Leaf {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * -50;
        this.size = Math.random() * 6 + 4;
        this.speedY = Math.random() * 1.4 + 0.7;
        this.speedX = Math.sin(Math.random() * Math.PI) * 0.9;
        this.opacity = Math.random() * 0.45 + 0.2;
        this.color = Math.random() > 0.5 ? '#80a775' : '#d4a359';
      }
      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y / 36) * 0.8;
        if (this.y > canvas.height) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.opacity;
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }
    }

    // Initialize Particles
    for (let i = 0; i < 16; i++) sunrays.push(new SunRay());
    for (let i = 0; i < 12; i++) leaves.push(new Leaf());

    // Main Animation Loop
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      sunrays.forEach(ray => { ray.update(); ray.draw(); });
      leaves.forEach(leaf => { leaf.update(); leaf.draw(); });
      requestAnimationFrame(animate);
    }
    animate();

    // --- Button Actions ---
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const question = document.getElementById('question');

    const playfulNoWords = [
      'No', 'Nope', 'Nah', 'Nuh-uh', 'HA not fast enough', 'Never', 'Pass', 'Nahh',
      'No way', 'Nope!', 'that makes me sad', 'oh really?!',
      'Click Yes for the pink controller :P', 'why you so meean T_T',
      "Can't catch this", 'Catch me', 'Too slow :3',
      'I can do this all day...', 'Maybe not', 'Nooo'
    ];
    let noWordIndex = 0;

    function changeNoWord() {
      noBtn.textContent = playfulNoWords[noWordIndex % playfulNoWords.length];
      noWordIndex += 1;
    }

    function moveButton() {
      if (noBtn.style.display === 'none') return;

      changeNoWord();

      const padding = 20;
      const maxX = Math.max(0, window.innerWidth - noBtn.offsetWidth - padding);
      const maxY = Math.max(0, window.innerHeight - noBtn.offsetHeight - padding);
      const x = Math.random() * maxX;
      const y = Math.random() * maxY;

      noBtn.style.position = 'fixed';
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
      noBtn.style.transform = 'scale(1.04) rotate(-2deg)';

      setTimeout(() => {
        if (noBtn.style.display !== 'none') {
          noBtn.style.transform = 'scale(1) rotate(0deg)';
        }
      }, 420);
    }

    noBtn.addEventListener('mouseover', moveButton);

    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveButton();
    });

    yesBtn.addEventListener('click', () => {
      question.innerText = "You're the best! Please kindly share the news to me!🎉";
      noBtn.style.display = 'none';
      yesBtn.style.transition = 'transform 0.18s ease, box-shadow 0.18s ease';
      yesBtn.style.transform = 'scale(1.1)';

      setTimeout(() => {
        yesBtn.style.transform = 'scale(1)';
      }, 120);

      confetti({
        particleCount: 90,
        spread: 70,
        startVelocity: 28,
        scalar: 0.9,
        colors: ['#b9dfc7', '#c8ead4', '#f8d7a6', '#d7ebff', '#f9c7d7'],
        origin: { y: 0.65 }
      });
    });
  </script>

</body>
</html>
</html>
