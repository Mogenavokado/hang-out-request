<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hang Out?</title>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
      
      /* Static Ghibli Background */
      background-image: url('https://images.unsplash.com/photo-1511497584788-876761c119ee?q=80&w=1920&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
    }

    /* Fullscreen Overlay Canvas for Rain & Particles */
    #particleCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    .content-wrapper {
      position: relative;
      z-index: 1;
      text-align: center;
      background: rgba(0, 0, 0, 0.35);
      padding: 40px;
      border-radius: 20px;
      backdrop-filter: blur(4px);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
    }

    h1 {
      font-size: 2.8rem;
      color: #ffffff;
      margin: 0;
      text-shadow: 0 3px 6px rgba(0,0,0,0.6);
    }

    .btn-container {
      margin-top: 30px;
      position: relative;
      width: 300px;
      height: 100px;
    }

    button {
      padding: 14px 28px;
      font-size: 1.3rem;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      position: absolute;
      transition: all 0.2s ease;
      box-shadow: 0 4px 15px rgba(0,0,0,0.4);
    }

    #yesBtn {
      background-color: #28a745;
      color: white;
      left: 30px;
    }

    #noBtn {
      background-color: #dc3545;
      color: white;
      right: 30px;
    }
  </style>
</head>
<body>

  <canvas id="particleCanvas"></canvas>

  <div class="content-wrapper">
    <h1 id="question">Will you hang out with me?</h1>
    <div class="btn-container">
      <button id="yesBtn">Yes!</button>
      <button id="noBtn">No</button>
    </div>
  </div>

  <script>
    // --- Canvas Rain & Leaf Animation Setup ---
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    const raindrops = [];
    const leaves = [];

    // Raindrop Object
    class Raindrop {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * -canvas.height;
        this.length = Math.random() * 20 + 10;
        this.speed = Math.random() * 10 + 12;
        this.opacity = Math.random() * 0.3 + 0.1;
      }
      update() {
        this.y += this.speed;
        if (this.y > canvas.height) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.strokeStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.lineWidth = 1;
        ctx.moveTo(this.x, this.y);
        ctx.lineTo(this.x - 1, this.y + this.length);
        ctx.stroke();
      }
    }

    // Floating Forest Leaf Object
    class Leaf {
      constructor() {
        this.reset();
      }
      reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * -50;
        this.size = Math.random() * 6 + 4;
        this.speedY = Math.random() * 1.5 + 0.8;
        this.speedX = Math.sin(Math.random() * Math.PI) * 1.2;
        this.opacity = Math.random() * 0.6 + 0.3;
        this.color = Math.random() > 0.5 ? '#80a775' : '#d4a359';
      }
      update() {
        this.y += this.speedY;
        this.x += Math.sin(this.y / 30) * 0.8;
        if (this.y > canvas.height) this.reset();
      }
      draw() {
        ctx.beginPath();
        ctx.fillStyle = this.color;
        ctx.globalAlpha = this.opacity;
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1.0;
      }
    }

    // Initialize Particles
    for (let i = 0; i < 120; i++) raindrops.push(new Raindrop());
    for (let i = 0; i < 25; i++) leaves.push(new Leaf());

    // Main Animation Loop
    function animate() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      raindrops.forEach(drop => { drop.update(); drop.draw(); });
      leaves.forEach(leaf => { leaf.update(); leaf.draw(); });
      requestAnimationFrame(animate);
    }
    animate();

    // --- Button Actions ---
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const question = document.getElementById('question');

    function moveButton() {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
      noBtn.style.position = 'fixed';
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    }

    noBtn.addEventListener('mouseover', moveButton);
    noBtn.addEventListener('touchstart', (e) => {
      e.preventDefault();
      moveButton();
    });

    yesBtn.addEventListener('click', () => {
      question.innerText = "Awesome! See you soon 🎉";
      noBtn.style.display = 'none';
      yesBtn.style.transform = 'scale(1.3)';

      confetti({
        particleCount: 150,
        spread: 90,
        origin: { y: 0.6 }
      });
    });
  </script>

</body>
</html>
