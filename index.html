<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hang Out?</title>
  <!-- Load canvas-confetti library from CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <style>
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      font-family: Arial, sans-serif;
      overflow: hidden;
      
      /* --- ANIMATED BACKGROUND ADDED HERE --- */
      /* Defines the linear gradient colors and initial position */
      background: linear-gradient(120deg, #f7f9fc 0%, #e0e6ed 30%, #d1d9e6 60%, #b8c6d1 100%);
      /* Makes the background 4x wider than the viewport to create room to slide */
      background-size: 400% 400%;
      /* Triggers the "gradientBG" keyframes: 10 seconds duration, endless loop, smooth ease in/out */
      animation: gradientBG 10s ease infinite;
    }

    /* Defines how the background gradient moves over time */
    @keyframes gradientBG {
      0% {
        background-position: 0% 50%;
      }
      50% {
        background-position: 100% 50%;
      }
      100% {
        background-position: 0% 50%;
      }
    }
    /* -------------------------------------- */

    h1 {
      font-size: 2.5rem;
      color: #333;
    }
    .btn-container {
      margin-top: 20px;
      position: relative;
      width: 300px;
      height: 100px;
    }
    button {
      padding: 12px 24px;
      font-size: 1.2rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      position: absolute;
      transition: all 0.2s ease;
    }
    #yesBtn {
      background-color: #28a745;
      color: white;
      left: 30px;
    }
    #noBtn {
      background-color: #dc3545;
      color: white;
      right: 30px;
    }
  </style>
</head>
<body>

  <h1 id="question">Will you hang out with me?</h1>
  <div class="btn-container">
    <button id="yesBtn">Yes!</button>
    <button id="noBtn">No</button>
  </div>

  <script>
    const noBtn = document.getElementById('noBtn');
    const yesBtn = document.getElementById('yesBtn');
    const question = document.getElementById('question');

    function moveButton() {
      const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
      const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
      noBtn.style.position = 'fixed';
      noBtn.style.left = `${x}px`;
      noBtn.style.top = `${y}px`;
    }

    noBtn.addEventListener('mouseover', moveButton);
    noBtn.addEventListener('touchstart', moveButton);

    yesBtn.addEventListener('click', () => {
      question.innerText = "Awesome! See you soon 🎉";
      noBtn.style.display = 'none';
      yesBtn.style.transform = 'scale(1.3)';

      // Trigger Confetti Explosion
      confetti({
        particleCount: 100,
        spread: 70,
        origin: { y: 0.6 }
      });
    });
  </script>

</body>
</html>
